<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap"
      rel="stylesheet"
    />
    <title>ARQO Design Collective</title>
    <meta
      name="description"
      content="ARQO Design Collective — premium architecture studio. Crafting modern spaces with luxury minimalism and innovation."
    />
    <script>
      ;(() => {
        try {
          const t = localStorage.getItem('arqo-theme')
          if (t === 'light' || t === 'dark' || t === 'relax') {
            document.documentElement.dataset.theme = t
          } else {
            document.documentElement.dataset.theme = 'light'
          }
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
